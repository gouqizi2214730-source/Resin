name: Build & Release Resin Windows Setup.exe & Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release Tag (e.g. v1.3.2)"
        required: false
        default: "v1.3.2"
  push:
    branches:
      - master
      - main
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

concurrency:
  group: release-exe-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-setup:
    name: Build Windows 11 Modern Chinese Setup.exe (PySide6 GUI + Go Core)
    runs-on: windows-latest
    steps:
      - name: Checkout Fork Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with Upstream Resinat/Resin (Preserve Custom GUI & Android Files)
        shell: pwsh
        run: |
          $backupDir = Join-Path $env:RUNNER_TEMP "resin_custom_backup"
          New-Item -ItemType Directory -Force -Path $backupDir | Out-Null
          $customItems = @(
            "desktop_gui",
            "android",
            "installer",
            "assets",
            "launcher.py",
            "scripts",
            "cmd/resin/bootstrap_dns.go",
            ".github/workflows/release-exe.yml"
          )
          foreach ($item in $customItems) {
            if (Test-Path $item) {
              $dest = Join-Path $backupDir $item
              $parent = Split-Path $dest -Parent
              New-Item -ItemType Directory -Force -Path $parent | Out-Null
              Copy-Item -Path $item -Destination $dest -Recurse -Force
            }
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Resinat/Resin.git 2>$null
          git fetch upstream master
          git merge upstream/master --no-edit -X ours; if ($LASTEXITCODE -ne 0) { git merge --abort }

          foreach ($item in $customItems) {
            $src = Join-Path $backupDir $item
            if (Test-Path $src) {
              $parent = Split-Path $item -Parent
              if ($parent) { New-Item -ItemType Directory -Force -Path $parent | Out-Null }
              Copy-Item -Path $src -Destination $item -Recurse -Force
            }
          }

      - name: Setup Node.js 22 & Build Embedded WebUI
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compile React WebUI (webui/dist)
        working-directory: ./webui
        run: |
          npm ci
          npm run build

      - name: Setup Go Toolchain
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Resin Go Core Engine (resin-core.exe)
        shell: pwsh
        env:
          CGO_ENABLED: "0"
          GOOS: "windows"
          GOARCH: "amd64"
        run: |
          $ver = "v1.3.2"
          $commit = (git rev-parse --short=8 HEAD)
          $buildTime = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          go build -trimpath -tags "with_quic with_wireguard with_grpc with_utls" `
            -ldflags="-s -w -X github.com/Resinat/Resin/internal/buildinfo.Version=$ver -X github.com/Resinat/Resin/internal/buildinfo.GitCommit=$commit -X github.com/Resinat/Resin/internal/buildinfo.BuildTime=$buildTime" `
            -o resin-core.exe ./cmd/resin
          if (-not (Test-Path ".\resin-core.exe")) {
            Write-Error "Failed to compile resin-core.exe"
            exit 1
          }
          .\resin-core.exe --version

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Packaging Dependencies & Generate Multi-Size Icon
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 Pillow pyinstaller
          python scripts/generate_icon.py

      - name: Build PyInstaller --onedir Distribution (No --onefile)
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --noconsole `
            --name "Resin" `
            --icon "assets/resin.ico" `
            --add-data "assets;assets" `
            --add-data "desktop_gui;desktop_gui" `
            --add-binary "resin-core.exe;." `
            --collect-all "desktop_gui" `
            launcher.py

          Copy-Item -Path ".\resin-core.exe" -Destination ".\dist\Resin\resin-core.exe" -Force
          New-Item -ItemType Directory -Force -Path ".\dist\Resin\assets" | Out-Null
          Copy-Item -Path ".\assets\*" -Destination ".\dist\Resin\assets\" -Recurse -Force
          if (Test-Path ".\README.zh-CN.md") {
            Copy-Item -Path ".\README.zh-CN.md" -Destination ".\dist\Resin\README.zh-CN.md" -Force
          }

      - name: Run Synchronous CI Self-Test (--mode self-test)
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath ".\dist\Resin\Resin.exe" -ArgumentList "--mode self-test" -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -ne 0) {
            Write-Error "CI self-test failed with exit code $($proc.ExitCode)"
            exit $proc.ExitCode
          }
          Write-Host "CI self-test passed with exit code 0"

      - name: Compile Modern Windows 11 Fluent Dark Chinese Setup Wizard (Resin-Setup-win64.exe)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ".\build" | Out-Null
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          $wpfDir = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\WPF"
          & $csc /target:winexe /platform:x64 /optimize+ /utf8output `
            /win32icon:assets\resin.ico `
            /r:"$wpfDir\PresentationFramework.dll" `
            /r:"$wpfDir\PresentationCore.dll" `
            /r:"$wpfDir\WindowsBase.dll" `
            /r:System.Xaml.dll `
            /r:System.IO.Compression.dll `
            /r:System.IO.Compression.FileSystem.dll `
            /out:build\Win11SetupStub.exe `
            installer\Win11FluentInstaller.cs
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path ".\build\Win11SetupStub.exe")) {
            Write-Error "Failed to compile Win11FluentInstaller.cs"
            exit 1
          }

          python scripts/build_win11_installer.py
          if (-not (Test-Path ".\dist_installer\Resin-Setup-win64.exe")) {
            Write-Error "Resin-Setup-win64.exe was not generated!"
            exit 1
          }

          $testInstallDir = Join-Path $env:RUNNER_TEMP "ResinWin11InstallerTest"
          $iproc = Start-Process -FilePath ".\dist_installer\Resin-Setup-win64.exe" -ArgumentList "/S", "/DIR=`"$testInstallDir`"" -Wait -PassThru -NoNewWindow
          if ($iproc.ExitCode -ne 0 -or -not (Test-Path (Join-Path $testInstallDir "Resin.exe"))) {
            Write-Error "Windows 11 installer verification failed with exit code $($iproc.ExitCode)"
            exit 1
          }
          Write-Host "Windows 11 Fluent Dark Chinese Installer verified cleanly!"
          Get-Item ".\dist_installer\Resin-Setup-win64.exe" | Select-Object Name, Length

      - name: Upload Windows Setup.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup-exe
          path: dist_installer/Resin-Setup-win64.exe
          retention-days: 5

  build-android-apk:
    name: Build Android APK (arm64-v8a PIE ET_DYN + Cutout/UDC Adaptive)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 & Build Embedded WebUI
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compile React WebUI (webui/dist)
        working-directory: ./webui
        run: |
          npm ci
          npm run build

      - name: Setup Go Toolchain
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cross-Compile Resin Go Core as Android PIE ET_DYN Shared Object (libresin_core.so)
        env:
          CGO_ENABLED: "0"
          GOOS: "linux"
          GOARCH: "arm64"
        run: |
          VERSION="v1.3.2"
          GIT_COMMIT=$(git rev-parse --short=8 HEAD)
          BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          go build -buildmode=pie -trimpath -tags "with_quic with_wireguard with_grpc with_utls" \
            -ldflags="-s -w \
            -X github.com/Resinat/Resin/internal/buildinfo.Version=${VERSION} \
            -X github.com/Resinat/Resin/internal/buildinfo.GitCommit=${GIT_COMMIT} \
            -X github.com/Resinat/Resin/internal/buildinfo.BuildTime=${BUILD_TIME}" \
            -o android/app/src/main/jniLibs/arm64-v8a/libresin_core.so ./cmd/resin
          chmod 755 android/app/src/main/jniLibs/arm64-v8a/libresin_core.so

          # Verify ELF Header is ET_DYN (e_type == 3) and has PT_DYNAMIC (p_type == 2) and 16KB+ PT_LOAD alignment
          python3 - << 'PYEOF'
          import struct
          with open("android/app/src/main/jniLibs/arm64-v8a/libresin_core.so", "rb") as f:
              so = f.read()
          e_type, e_machine = struct.unpack("<HH", so[16:20])
          e_phoff, _, _, _, e_phentsize, e_phnum = struct.unpack("<QQIHHH", so[32:58])
          print(f"Verified libresin_core.so ELF: e_type={e_type} (must be 3=ET_DYN), e_machine={e_machine}, e_phnum={e_phnum}")
          assert e_type == 3, f"Expected ET_DYN (3), got {e_type}"
          has_dynamic = False
          for i in range(e_phnum):
              off = e_phoff + i * e_phentsize
              p_type, p_flags, p_offset, p_vaddr, p_paddr, p_filesz, p_memsz, p_align = struct.unpack("<IIQQQQQQ", so[off:off+56])
              if p_type == 2:
                  has_dynamic = True
              if p_type == 1:
                  print(f"  PT_LOAD[{i}]: p_align=0x{p_align:x} ({p_align})")
                  assert p_align >= 0x4000, f"PT_LOAD alignment {p_align} < 16KB"
          assert has_dynamic, "Missing PT_DYNAMIC header in libresin_core.so"
          print("ELF PIE ET_DYN & 16KB alignment check PASSED!")
          PYEOF

      - name: Generate Android Launcher Icons
        run: |
          python3 -m pip install --upgrade pip pillow
          python3 scripts/generate_icon.py

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Signed Release Android APK via Gradle & Verify V1+V2+V3 Signatures
        working-directory: ./android
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          mkdir -p ../dist_apk
          BUILT_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found Gradle signed APK: $BUILT_APK"
          cp "$BUILT_APK" ../dist_apk/Resin-v1.3.2-arm64-v8a.apk

          APKSIGNER_BIN=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -V | tail -n 1)
          if [ -n "$APKSIGNER_BIN" ]; then
            "$APKSIGNER_BIN" verify -v --min-sdk-version 21 ../dist_apk/Resin-v1.3.2-arm64-v8a.apk
          fi
          ls -lh ../dist_apk/Resin-v1.3.2-arm64-v8a.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist_apk/Resin-v1.3.2-arm64-v8a.apk
          retention-days: 5

  publish-release:
    name: Publish GitHub Release v1.3.2 (Setup.exe & Fixed Adaptive APK)
    runs-on: ubuntu-latest
    needs: [build-windows-setup, build-android-apk]
    permissions:
      contents: write
    steps:
      - name: Download Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Verify Release Assets
        run: |
          ls -lh release_assets/
          test -f release_assets/Resin-Setup-win64.exe
          test -f release_assets/Resin-v1.3.2-arm64-v8a.apk

      - name: Create Release Notes
        run: |
          cat << 'EOF' > release_notes.md
          ## 🛡️ Resin 智能代理池网关 v1.3.2 (修复 Android 16 安装兼容性 & 异形屏/屏下摄像头自适应)

          本发行版针对 Android 15 / Android 16 (OnePlus 15R / OxygenOS 16) 完成了 APK 安装器底层兼容性修复，同时提供 **Android 异形屏与屏下摄像头 (UDC) 自适应安装包 (`Resin-v1.3.2-arm64-v8a.apk`)** 与 **Windows 11 Fluent Dark 全中文现代安装包 (`Resin-Setup-win64.exe`)**。

          ### 🔧 v1.3.2 Android APK 安装失败修复说明
          1. **修复 `libresin_core.so` ELF 类型 (`ET_EXEC` -> `ET_DYN` PIE + `PT_DYNAMIC`)**
             - 开启 Go `-buildmode=pie` 位置无关可执行文件编译，生成具备 `ET_DYN (e_type=3)`、`PT_DYNAMIC` 动态段与 `64KB (0x10000 >= 16KB)` 段对齐的原生 ELF 二进制，彻底解决 Android 15/16 `PackageManager` (`NativeLibraryHelper` / Bionic `ElfReader`) 因非 PIE 拒绝提取 `.so` 导致的安装失败 (`INSTALL_FAILED_INVALID_APK`)。
          2. **固化仓库级持久化签名证书 (`resin-keystore.jks`) 与独立包名 (`com.resinat.resin.gateway`)**
             - 移除原先每次 CI 临时生成的随机密钥对与二次 `zipalign` 重签名操作，改由 Gradle 原生一步完成 `zipalign` 与 **V1 + V2 + V3 全通过签名**，并使用独立包名 `com.resinat.resin.gateway`，彻底消除旧版随机签名残留导致的 `INSTALL_FAILED_UPDATE_INCOMPATIBLE`（签名不一致无法覆盖安装）问题。
          3. **优化 Android 14–16 前台服务与异形屏/屏下摄像头自适应 (`AdaptiveScreenManager.kt`)**
             - 采用经过一加 15R 实机验证的 `dataSync` 前台服务声明，内置异形屏（挖孔/药丸/刘海/曲面/折叠）四向安全区动态避让与屏下摄像头（UDC）`#03050A` 光学消光保护区。
          EOF

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || 'v1.3.2' }}
          name: "Resin 智能代理池网关 ${{ inputs.release_tag || 'v1.3.2' }} (Android 安装修复自适应 APK & Win11 中文安装器)"
          body_path: release_notes.md
          draft: false
          prerelease: false
          overwrite_files: true
          files: |
            release_assets/Resin-Setup-win64.exe
            release_assets/Resin-v1.3.2-arm64-v8a.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
