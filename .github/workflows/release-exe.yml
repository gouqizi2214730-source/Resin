name: Build & Release Resin Windows Setup.exe & Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release Tag (e.g. v1.1.0)"
        required: false
        default: "v1.1.0"
  push:
    branches:
      - master
      - main
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

concurrency:
  group: release-exe-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-setup:
    name: Build Windows Setup.exe (PySide6 GUI + Go Core)
    runs-on: windows-latest
    steps:
      - name: Checkout Fork Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with Upstream Resinat/Resin (Preserve Custom GUI & Android Files)
        shell: pwsh
        run: |
          $backupDir = Join-Path $env:RUNNER_TEMP "resin_custom_backup"
          New-Item -ItemType Directory -Force -Path $backupDir | Out-Null
          $customItems = @(
            "desktop_gui",
            "android",
            "installer",
            "assets",
            "launcher.py",
            "scripts",
            "cmd/resin/bootstrap_dns.go",
            ".github/workflows/release-exe.yml"
          )
          foreach ($item in $customItems) {
            if (Test-Path $item) {
              $dest = Join-Path $backupDir $item
              $parent = Split-Path $dest -Parent
              New-Item -ItemType Directory -Force -Path $parent | Out-Null
              Copy-Item -Path $item -Destination $dest -Recurse -Force
            }
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Resinat/Resin.git 2>$null
          git fetch upstream master
          git merge upstream/master --no-edit -X ours; if ($LASTEXITCODE -ne 0) { git merge --abort }

          foreach ($item in $customItems) {
            $src = Join-Path $backupDir $item
            if (Test-Path $src) {
              $parent = Split-Path $item -Parent
              if ($parent) { New-Item -ItemType Directory -Force -Path $parent | Out-Null }
              Copy-Item -Path $src -Destination $item -Recurse -Force
            }
          }

      - name: Setup Node.js 22 & Build Embedded WebUI
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compile React WebUI (webui/dist)
        working-directory: ./webui
        run: |
          npm ci
          npm run build

      - name: Setup Go Toolchain
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Resin Go Core Engine (resin-core.exe)
        shell: pwsh
        env:
          CGO_ENABLED: "0"
          GOOS: "windows"
          GOARCH: "amd64"
        run: |
          $ver = "v1.1.0"
          $commit = (git rev-parse --short=8 HEAD)
          $buildTime = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          go build -trimpath -tags "with_quic with_wireguard with_grpc with_utls" `
            -ldflags="-s -w -X github.com/Resinat/Resin/internal/buildinfo.Version=$ver -X github.com/Resinat/Resin/internal/buildinfo.GitCommit=$commit -X github.com/Resinat/Resin/internal/buildinfo.BuildTime=$buildTime" `
            -o resin-core.exe ./cmd/resin
          if (-not (Test-Path ".\resin-core.exe")) {
            Write-Error "Failed to compile resin-core.exe"
            exit 1
          }
          .\resin-core.exe --version

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Packaging Dependencies & Generate Multi-Size Icon
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 Pillow pyinstaller
          python scripts/generate_icon.py

      - name: Build PyInstaller --onedir Distribution (No --onefile)
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --noconsole `
            --name "Resin" `
            --icon "assets/resin.ico" `
            --add-data "assets;assets" `
            --add-data "desktop_gui;desktop_gui" `
            --add-binary "resin-core.exe;." `
            --collect-all "desktop_gui" `
            launcher.py

          Copy-Item -Path ".\resin-core.exe" -Destination ".\dist\Resin\resin-core.exe" -Force
          New-Item -ItemType Directory -Force -Path ".\dist\Resin\assets" | Out-Null
          Copy-Item -Path ".\assets\*" -Destination ".\dist\Resin\assets\" -Recurse -Force
          if (Test-Path ".\README.zh-CN.md") {
            Copy-Item -Path ".\README.zh-CN.md" -Destination ".\dist\Resin\README.zh-CN.md" -Force
          }

      - name: Run Synchronous CI Self-Test (--mode self-test)
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath ".\dist\Resin\Resin.exe" -ArgumentList "--mode self-test" -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -ne 0) {
            Write-Error "CI self-test failed with exit code $($proc.ExitCode)"
            exit $proc.ExitCode
          }
          Write-Host "CI self-test passed with exit code 0"

      - name: Compile Inno Setup Standard Installer (Resin-Setup-win64.exe)
        shell: pwsh
        run: |
          iscc /DMyAppVersion="1.1.0" installer\resin.iss
          if (-not (Test-Path ".\dist_installer\Resin-Setup-win64.exe")) {
            Write-Error "Resin-Setup-win64.exe was not generated!"
            exit 1
          }
          Get-Item ".\dist_installer\Resin-Setup-win64.exe" | Select-Object Name, Length

      - name: Upload Windows Setup.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup-exe
          path: dist_installer/Resin-Setup-win64.exe
          retention-days: 5

  build-android-apk:
    name: Build Android APK (arm64-v8a + Embedded Go Core)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 & Build Embedded WebUI
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compile React WebUI (webui/dist)
        working-directory: ./webui
        run: |
          npm ci
          npm run build

      - name: Setup Go Toolchain
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cross-Compile Resin Go Core for Android arm64-v8a (libresin_core.so)
        env:
          CGO_ENABLED: "0"
          GOOS: "linux"
          GOARCH: "arm64"
        run: |
          VERSION="v1.1.0"
          GIT_COMMIT=$(git rev-parse --short=8 HEAD)
          BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          go build -trimpath -tags "with_quic with_wireguard with_grpc with_utls" \
            -ldflags="-s -w \
            -X github.com/Resinat/Resin/internal/buildinfo.Version=${VERSION} \
            -X github.com/Resinat/Resin/internal/buildinfo.GitCommit=${GIT_COMMIT} \
            -X github.com/Resinat/Resin/internal/buildinfo.BuildTime=${BUILD_TIME}" \
            -o android/app/src/main/jniLibs/arm64-v8a/libresin_core.so ./cmd/resin
          chmod 755 android/app/src/main/jniLibs/arm64-v8a/libresin_core.so
          ls -lh android/app/src/main/jniLibs/arm64-v8a/libresin_core.so

      - name: Generate Android Launcher Icons
        run: |
          python3 -m pip install --upgrade pip pillow
          python3 scripts/generate_icon.py

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Signed Release Android APK
        working-directory: ./android
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          mkdir -p ../dist_apk
          cp app/build/outputs/apk/release/app-release.apk ../dist_apk/Resin-v1.1.0-arm64-v8a.apk
          ls -lh ../dist_apk/Resin-v1.1.0-arm64-v8a.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist_apk/Resin-v1.1.0-arm64-v8a.apk
          retention-days: 5

  publish-release:
    name: Publish GitHub Release (Setup.exe & APK)
    runs-on: ubuntu-latest
    needs: [build-windows-setup, build-android-apk]
    permissions:
      contents: write
    steps:
      - name: Download Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Verify Release Assets
        run: |
          ls -lh release_assets/
          test -f release_assets/Resin-Setup-win64.exe
          test -f release_assets/Resin-v1.1.0-arm64-v8a.apk

      - name: Create Release Notes
        run: |
          cat << 'EOF' > release_notes.md
          ## 🛡️ Resin 智能代理池网关 v1.1.0 (Windows 中文桌面安装包 & Android 移动端 APK)

          本发行版基于上游 [`Resinat/Resin`](https://github.com/Resinat/Resin) 深度构建，提供 **Windows 64 位标准向导安装包 (`Resin-Setup-win64.exe`)** 与 **Android 64 位移动端安装包 (`Resin-v1.1.0-arm64-v8a.apk`)**。

          ### 📦 发行资产清单
          1. **`Resin-Setup-win64.exe` (Windows 10/11 64位标准安装程序)**
             - **纯原生 PySide6 (Qt 6) 现代暗色中文桌面客户端**（支持 Per-Monitor v2 HiDPI 高分屏抗锯齿渲染、自定义安装路径、桌面与开始菜单快捷方式、标准控制面板卸载程序）。
             - **内置 `resin-core.exe` 高性能 Go 核心网关引擎**：启动客户端即自动托管并拉起本地网关守护进程（默认端口 `2260`，支持一键设为 Windows 系统代理），同时支持连接任意远程 Resin 服务器。
             - **100% 完整覆盖原项目功能**：网关总览与实时监控、订阅源管理（Sing-box / Clash / URI / Base64 / HTTP）、Platform 粘性隔离池与正则/地区过滤预览、全局节点池与主动出口/延迟探测、粘性租约管理与子账号租约继承、多接入点端口热管理与代理连通性测试工坊、请求头账号提取规则与 URL 仿真器、结构化请求日志与报文载荷审计、GeoIP 查询与运行时配置热更新。
             - **数据源 API 中心 & 本地/云端大模型助手**：内置本地 OpenAI 兼容网关（`127.0.0.1:8787`），支持 Ollama / LM Studio / vLLM 免 Key 本地推理与 DeepSeek / 通义千问 / 硅基流动 / 智谱 GLM / Kimi / OpenAI / Gemini / Claude 等云端模型，一键生成 Platform 正则规则与业务粘性接入代码。
          2. **`Resin-v1.1.0-arm64-v8a.apk` (Android 8.0+ / Android 16 64位安装包)**
             - **内置 `libresin_core.so` 本地 Go 核心网关引擎 + 远程控制双模式**：支持通过 Android 前台常驻服务直接在手机本地运行完整的 Resin 粘性代理池网关（自动适配无 `/etc/resolv.conf` 的 Bootstrap DNS 与 Android 14-16 APEX CA 证书目录），亦可远程管理电脑或云服务器上的 Resin 节点池。
             - **6 大全中文原生功能模块 + 内置完整 React WebUI 控制台**。
          EOF

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || 'v1.1.0' }}
          name: "Resin 智能代理池网关 ${{ inputs.release_tag || 'v1.1.0' }} (Windows Setup.exe & Android APK)"
          body_path: release_notes.md
          draft: false
          prerelease: false
          overwrite_files: true
          files: |
            release_assets/Resin-Setup-win64.exe
            release_assets/Resin-v1.1.0-arm64-v8a.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
