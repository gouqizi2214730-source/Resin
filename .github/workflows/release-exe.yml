name: Build & Release Resin Windows Setup.exe & Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release Tag (e.g. v1.3.0)"
        required: false
        default: "v1.3.0"
  push:
    branches:
      - master
      - main
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

concurrency:
  group: release-exe-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-setup:
    name: Build Windows 11 Modern Chinese Setup.exe (PySide6 GUI + Go Core)
    runs-on: windows-latest
    steps:
      - name: Checkout Fork Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with Upstream Resinat/Resin (Preserve Custom GUI & Android Files)
        shell: pwsh
        run: |
          $backupDir = Join-Path $env:RUNNER_TEMP "resin_custom_backup"
          New-Item -ItemType Directory -Force -Path $backupDir | Out-Null
          $customItems = @(
            "desktop_gui",
            "android",
            "installer",
            "assets",
            "launcher.py",
            "scripts",
            "cmd/resin/bootstrap_dns.go",
            ".github/workflows/release-exe.yml"
          )
          foreach ($item in $customItems) {
            if (Test-Path $item) {
              $dest = Join-Path $backupDir $item
              $parent = Split-Path $dest -Parent
              New-Item -ItemType Directory -Force -Path $parent | Out-Null
              Copy-Item -Path $item -Destination $dest -Recurse -Force
            }
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Resinat/Resin.git 2>$null
          git fetch upstream master
          git merge upstream/master --no-edit -X ours; if ($LASTEXITCODE -ne 0) { git merge --abort }

          foreach ($item in $customItems) {
            $src = Join-Path $backupDir $item
            if (Test-Path $src) {
              $parent = Split-Path $item -Parent
              if ($parent) { New-Item -ItemType Directory -Force -Path $parent | Out-Null }
              Copy-Item -Path $src -Destination $item -Recurse -Force
            }
          }

      - name: Setup Node.js 22 & Build Embedded WebUI
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compile React WebUI (webui/dist)
        working-directory: ./webui
        run: |
          npm ci
          npm run build

      - name: Setup Go Toolchain
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Resin Go Core Engine (resin-core.exe)
        shell: pwsh
        env:
          CGO_ENABLED: "0"
          GOOS: "windows"
          GOARCH: "amd64"
        run: |
          $ver = "v1.3.0"
          $commit = (git rev-parse --short=8 HEAD)
          $buildTime = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          go build -trimpath -tags "with_quic with_wireguard with_grpc with_utls" `
            -ldflags="-s -w -X github.com/Resinat/Resin/internal/buildinfo.Version=$ver -X github.com/Resinat/Resin/internal/buildinfo.GitCommit=$commit -X github.com/Resinat/Resin/internal/buildinfo.BuildTime=$buildTime" `
            -o resin-core.exe ./cmd/resin
          if (-not (Test-Path ".\resin-core.exe")) {
            Write-Error "Failed to compile resin-core.exe"
            exit 1
          }
          .\resin-core.exe --version

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Packaging Dependencies & Generate Multi-Size Icon
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 Pillow pyinstaller
          python scripts/generate_icon.py

      - name: Build PyInstaller --onedir Distribution (No --onefile)
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --noconsole `
            --name "Resin" `
            --icon "assets/resin.ico" `
            --add-data "assets;assets" `
            --add-data "desktop_gui;desktop_gui" `
            --add-binary "resin-core.exe;." `
            --collect-all "desktop_gui" `
            launcher.py

          Copy-Item -Path ".\resin-core.exe" -Destination ".\dist\Resin\resin-core.exe" -Force
          New-Item -ItemType Directory -Force -Path ".\dist\Resin\assets" | Out-Null
          Copy-Item -Path ".\assets\*" -Destination ".\dist\Resin\assets\" -Recurse -Force
          if (Test-Path ".\README.zh-CN.md") {
            Copy-Item -Path ".\README.zh-CN.md" -Destination ".\dist\Resin\README.zh-CN.md" -Force
          }

      - name: Run Synchronous CI Self-Test (--mode self-test)
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath ".\dist\Resin\Resin.exe" -ArgumentList "--mode self-test" -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -ne 0) {
            Write-Error "CI self-test failed with exit code $($proc.ExitCode)"
            exit $proc.ExitCode
          }
          Write-Host "CI self-test passed with exit code 0"

      - name: Compile Modern Windows 11 Fluent Dark Chinese Setup Wizard (Resin-Setup-win64.exe)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ".\build" | Out-Null
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          $wpfDir = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\WPF"
          & $csc /target:winexe /platform:x64 /optimize+ /utf8output `
            /win32icon:assets\resin.ico `
            /r:"$wpfDir\PresentationFramework.dll" `
            /r:"$wpfDir\PresentationCore.dll" `
            /r:"$wpfDir\WindowsBase.dll" `
            /r:System.Xaml.dll `
            /r:System.IO.Compression.dll `
            /r:System.IO.Compression.FileSystem.dll `
            /out:build\Win11SetupStub.exe `
            installer\Win11FluentInstaller.cs
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path ".\build\Win11SetupStub.exe")) {
            Write-Error "Failed to compile Win11FluentInstaller.cs"
            exit 1
          }

          python scripts/build_win11_installer.py
          if (-not (Test-Path ".\dist_installer\Resin-Setup-win64.exe")) {
            Write-Error "Resin-Setup-win64.exe was not generated!"
            exit 1
          }

          $testInstallDir = Join-Path $env:RUNNER_TEMP "ResinWin11InstallerTest"
          $iproc = Start-Process -FilePath ".\dist_installer\Resin-Setup-win64.exe" -ArgumentList "/S", "/DIR=`"$testInstallDir`"" -Wait -PassThru -NoNewWindow
          if ($iproc.ExitCode -ne 0 -or -not (Test-Path (Join-Path $testInstallDir "Resin.exe"))) {
            Write-Error "Windows 11 installer verification failed with exit code $($iproc.ExitCode)"
            exit 1
          }
          Write-Host "Windows 11 Fluent Dark Chinese Installer verified cleanly!"
          Get-Item ".\dist_installer\Resin-Setup-win64.exe" | Select-Object Name, Length

      - name: Upload Windows Setup.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup-exe
          path: dist_installer/Resin-Setup-win64.exe
          retention-days: 5

  build-android-apk:
    name: Build Android APK (arm64-v8a + Cutout/UDC Adaptive + 16KB Aligned)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 & Build Embedded WebUI
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compile React WebUI (webui/dist)
        working-directory: ./webui
        run: |
          npm ci
          npm run build

      - name: Setup Go Toolchain
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cross-Compile Resin Go Core for Android arm64-v8a (libresin_core.so)
        env:
          CGO_ENABLED: "0"
          GOOS: "linux"
          GOARCH: "arm64"
        run: |
          VERSION="v1.3.0"
          GIT_COMMIT=$(git rev-parse --short=8 HEAD)
          BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          go build -trimpath -tags "with_quic with_wireguard with_grpc with_utls" \
            -ldflags="-s -w \
            -X github.com/Resinat/Resin/internal/buildinfo.Version=${VERSION} \
            -X github.com/Resinat/Resin/internal/buildinfo.GitCommit=${GIT_COMMIT} \
            -X github.com/Resinat/Resin/internal/buildinfo.BuildTime=${BUILD_TIME}" \
            -o android/app/src/main/jniLibs/arm64-v8a/libresin_core.so ./cmd/resin
          chmod 755 android/app/src/main/jniLibs/arm64-v8a/libresin_core.so
          ls -lh android/app/src/main/jniLibs/arm64-v8a/libresin_core.so

      - name: Generate Android Launcher Icons
        run: |
          python3 -m pip install --upgrade pip pillow
          python3 scripts/generate_icon.py

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Generate Dedicated Release Keystore (resin-release.jks)
        working-directory: ./android/app
        run: |
          keytool -genkeypair -v \
            -keystore resin-release.jks \
            -alias resin_key \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass resin_release_store \
            -keypass resin_release_store \
            -dname "CN=Resin Proxy Gateway, OU=Engineering, O=ResinProject, L=Shanghai, ST=Shanghai, C=CN"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Signed & 16KB Page-Aligned Release Android APK
        working-directory: ./android
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          mkdir -p ../dist_apk
          RAW_APK="app/build/outputs/apk/release/app-release.apk"
          ZIPALIGN_BIN=$(find $ANDROID_HOME/build-tools -name "zipalign" | sort -V | tail -n 1)
          APKSIGNER_BIN=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -V | tail -n 1)

          if [ -n "$ZIPALIGN_BIN" ] && [ -n "$APKSIGNER_BIN" ]; then
            "$ZIPALIGN_BIN" -P 16 -f -v 4 "$RAW_APK" ../dist_apk/Resin-v1.3.0-arm64-v8a.apk
            "$APKSIGNER_BIN" sign --ks app/resin-release.jks \
              --ks-key-alias resin_key \
              --ks-pass pass:resin_release_store \
              --key-pass pass:resin_release_store \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              ../dist_apk/Resin-v1.3.0-arm64-v8a.apk
            "$APKSIGNER_BIN" verify -v ../dist_apk/Resin-v1.3.0-arm64-v8a.apk
          else
            cp "$RAW_APK" ../dist_apk/Resin-v1.3.0-arm64-v8a.apk
          fi
          ls -lh ../dist_apk/Resin-v1.3.0-arm64-v8a.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist_apk/Resin-v1.3.0-arm64-v8a.apk
          retention-days: 5

  publish-release:
    name: Publish GitHub Release v1.3.0 (Setup.exe & Adaptive APK)
    runs-on: ubuntu-latest
    needs: [build-windows-setup, build-android-apk]
    permissions:
      contents: write
    steps:
      - name: Download Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Verify Release Assets
        run: |
          ls -lh release_assets/
          test -f release_assets/Resin-Setup-win64.exe
          test -f release_assets/Resin-v1.3.0-arm64-v8a.apk

      - name: Create Release Notes
        run: |
          cat << 'EOF' > release_notes.md
          ## 🛡️ Resin 智能代理池网关 v1.3.0 (Android 异形屏/屏下摄像头自适应 & Windows 11 全中文现代安装器)

          本发行版基于上游 [`Resinat/Resin`](https://github.com/Resinat/Resin) 深度构建，提供 **Android 异形屏与屏下摄像头 (UDC) 全场景自适应安装包 (`Resin-v1.3.0-arm64-v8a.apk`)** 与 **Windows 11 Fluent Dark 全中文现代安装包 (`Resin-Setup-win64.exe`)**。

          ### 📱 v1.3.0 Android 异形屏与屏下摄像头 (UDC) 自适应引擎新增特性
          1. **全形态异形屏智能识别与四向避让 (`AdaptiveScreenManager.kt`)**
             - 基于 `WindowInsetsCompat` (`systemBars()` + `displayCutout()` + `ime()`) 与 `LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS` 全屏沉浸延伸架构，自动检测并分类 **顶部居中单挖孔/水滴屏**、**左上角前置挖孔屏**、**右上角前置挖孔屏**、**居中宽药丸双挖孔/刘海屏**、**横屏侧边开孔** 以及 **真全面屏/屏下摄像头 (UDC)**。
             - 原生声明多厂商异形屏与超长纵横比（`2.6:1`）适配元数据（`android.notch_support`、`notch.config`、`oo.display.cutout_support`），消除顶部/底部黑边，同时确保顶栏标题、快捷按钮、底部列表及内嵌 WebUI 控制台永不被挖孔或全面屏手势横条遮挡。
          2. **屏下摄像头 (UDC - Under-Display Camera) 光学防眩光消光保护带**
             - 针对屏下摄像头机型（如真全面屏 UDC 手机与折叠屏内屏 UDC），内置 `#03050A` 超低亮度纯黑消光保护区（`UDC 屏下镜头光学消光保护区`），防止高亮度像素在屏下镜头感光区造成衍射眩光或纱窗纹干扰，并自动将交互控件下移避开镜头光轴。
          3. **双曲面瀑布屏 / 折叠屏大屏防误触与实时微调面板**
             - 在主页新增 **「📱 异形屏与屏下摄像头 (UDC) 自适应」** 实时控制卡片，支持一键切换 4 种自适应模式（`智能自动感应` / `屏下摄像头光学防眩光模式` / `异形屏增强四向安全避让` / `双曲面瀑布屏与折叠屏防误触`），支持一键微调顶部避让高度（`0dp ~ +18dp`）与曲面侧边防误触边距（`0dp ~ +20dp`），并实时展示屏幕物理分辨率、开孔坐标矩阵 (`Cutout Rects`) 与四向安全内边距。

          ### 💻 Windows 11 Fluent Dark 全中文现代安装包 (`Resin-Setup-win64.exe`)
          - **100% 简体中文 Windows 11 圆角暗色卡片安装向导**（内置全中文图形化卸载程序 `Uninstall-Resin.exe`）、系统托盘最小化常驻、开机自启开关、实时双动态折线图大屏与 AI 自动巡检自愈引擎。
          EOF

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || 'v1.3.0' }}
          name: "Resin 智能代理池网关 ${{ inputs.release_tag || 'v1.3.0' }} (异形屏/屏下摄像头自适应 APK & Win11 中文安装器)"
          body_path: release_notes.md
          draft: false
          prerelease: false
          overwrite_files: true
          files: |
            release_assets/Resin-Setup-win64.exe
            release_assets/Resin-v1.3.0-arm64-v8a.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
