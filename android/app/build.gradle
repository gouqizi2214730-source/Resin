plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.resinat.resin.android'
    compileSdk 35

    defaultConfig {
        applicationId "com.resinat.resin.android"
        minSdk 26
        targetSdk 35
        versionCode 120
        versionName "1.2.0"

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    signingConfigs {
        release {
            def ksFile = file("resin-release.jks")
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword "resin_release_store"
                keyAlias "resin_key"
                keyPassword "resin_release_store"
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig file("resin-release.jks").exists() ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
